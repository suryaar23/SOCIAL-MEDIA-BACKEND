# Production Configuration
# Production Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:/app/aiven-truststore.jks&trustCertificateKeyStorePassword=${DB_SSL_TRUSTSTORE_PASSWORD}&trustCertificateKeyStoreType=JKS
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.open-in-view=false

# Server Configuration
server.port=${PORT:8080}
spring.application.name=social-media-backend

#MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/social_media
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

#JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=900000

# Backblaze B2 Storage
b2.endpoint=https://s3.eu-central-003.backblazeb2.com
b2.region=eu-central-003
b2.bucket-name=social-media-uploads-surya

b2.key-id=${B2_KEY_ID}
b2.application-key=${B2_APPLICATION_KEY}